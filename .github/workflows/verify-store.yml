# After the store has published a version: download the CRX the store serves and compare it
# file by file with the release zip. Run by hand (Actions, verify-store, Run workflow) once the
# review has passed; commit the report as security/store-diff/<version>.md.
name: verify-store

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose zip should match the store (v1.0.8)
        required: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Compare the store package with the release zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          gh release download "$TAG" --pattern '*.zip' --dir release
          node scripts/verify-store.mjs "$EXTENSION_ID" release/*.zip "security/store-diff/${TAG#v}.md" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-diff-${{ inputs.tag }}
          path: security/store-diff/
