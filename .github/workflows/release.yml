# On a version tag (v1.0.8): test, build twice to prove the zip is reproducible, run the scans,
# write security/scans/<version>.md, and attach the zip, its SHA-256 and the scan report to a
# draft GitHub release. Publishing the release and the store upload stay manual.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the draft release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Tag matches the manifest version
        run: |
          v=$(node -p "require('./public/manifest.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but manifest says $v"; exit 1; }
      - run: npm test
      - name: Build twice and compare (reproducible zip)
        run: node scripts/package.mjs --verify
      - name: Scans
        run: |
          mkdir -p scan
          node scripts/manifest-guard.mjs > scan/guard.txt
          curl -fsSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner -f json -r scan/gitleaks.json --exit-code 1 .
          npm audit --json > scan/npm-audit.json || true
          npm audit --audit-level=high
          curl -fsSLo osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile package-lock.json --config osv-scanner.toml --format json > scan/osv.json
          pip install semgrep==1.182.1
          semgrep scan --config p/javascript --config p/secrets --config p/xss --config p/owasp-top-ten --metrics off --error --json -o scan/semgrep.json src public app.html scripts
          npx --yes retire@5.7.0 --path dist --severity medium --exitwith 1 --outputformat json --outputpath scan/retire.json
      - name: Scan report
        run: node scripts/scan-report.mjs scan out/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: |
            out/
            security/scans/
          retention-days: 90
      - name: Draft GitHub release with zip, SHA-256 and scan report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v=${GITHUB_REF_NAME#v}
          zip=$(ls out/*.zip)
          cp security/scans/$v.md "scan-report-$v.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" "$zip.sha256" "scan-report-$v.md" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "Data Cloud Inspector $v" --notes "Built by CI from $GITHUB_SHA. SHA-256: $(cut -d' ' -f1 $zip.sha256). Scan report attached (automated, not independent). Commit security/scans/$v.md from the attached report." "$zip" "$zip.sha256" "scan-report-$v.md"
          fi
